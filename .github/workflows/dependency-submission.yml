name: Dependency Submission

# Submits resolved Gradle dependencies to GitHub's dependency graph so
# Dependabot alerts cover Android libraries (Gradle isn't parsed statically).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/dependency-submission@v6
